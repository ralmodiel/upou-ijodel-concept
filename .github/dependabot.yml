version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
    versioning-strategy: increase # keeps exact pins (deps.mjs checks them)
    open-pull-requests-limit: 5
    groups: { dev: { dependency-type: development } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
